    </header>

    <main style="max-width: 600px;">
        <h1>CONTACT</h1>

        <form id="contactForm" onsubmit="return valContato(event)" class="card">
            <div class="form-group">
                <label for="nome">Name</label>
                <input type="text" id="nome" class="form-control" required placeholder="Enter your full name"
                    pattern="^[a-zA-ZáàâãéèêíïóôõöúçñÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ\s]+$">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="youremail@provider.com">
            </div>

            <div class="form-group">
                <label for="telefone">Phone</label>
                <input type="tel" id="telefone" class="form-control" required pattern="[0-9\s\-\(\)\+]{10,15}"
                    placeholder="Phone number">
            </div>

            <div class="form-group">
                <label for="avaliacao">Rate our website</label>
                <select id="avaliacao" class="form-control" required style="background-color: var(--azul-profundo);">
                    <option value="" disabled selected>Choose a rating from 0 to 5</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comentario">Leave your comment</label>
                <textarea id="comentario" class="form-control" rows="4" placeholder="Add here a comment!"></textarea>
            </div>

            <button type="submit" class="btn-submit">Send</button>
        </form>
    </main>
    <footer>
        <a class="ancora" href="#"><img src="../img/seta.png" width="50" height="50"></a>
        <p><strong>ETEC DE HORTOLÂNDIA 2026</strong> — © All rights reserved</p>
        <p>Academic non-profit project</p>
    </footer>
    <script>
        function valContato(e) {
            e.preventDefault();
            const n = document.getElementById('nome').value;
            const a = document.getElementById('avaliacao').value;
            if (n.trim().length < 3) {
                alert('Please enter your full name.');
                return false;
            }
            alert('Thank you, ' + n + '! Your ' + a + '/5 rating was successfully submitted.');
            document.getElementById('contactForm').reset();
            return true;
        }
    </script>
    <script>
        document.querySelector('.menu-toggle').addEventListener('click', () => {
            document.querySelector('.menu-toggle').classList.toggle('active');
            document.querySelector('.nav-menu').classList.toggle('active');
        });
    </script>
