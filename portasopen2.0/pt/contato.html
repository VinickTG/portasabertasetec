        <div class="nav-container">
            <a style="margin-right: 20px;" href="../../index.html" class="logo">GAME<span>EVO</span></a>
            <nav>
                <ul class="nav-menu">
                    <li>
                        <a href="../../index.html" class="nav-link">Home</a>
                    </li>
                    <li>
                        <a href="sobre.html" class="nav-link">Sobre</a>
                    </li>
                    <li>
                        <a href="aplicacoes.html" class="nav-link">Aplicações</a>
                    </li>
                    <li>
                        <a href="bibliografia.html" class="nav-link">Bibliografia</a>
                    </li>
                    <li class="dropdown">
                        <a href="#" class="nav-link">Créditos</a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="orientadores.html">Orientadores</a>
                            </li>
                            <li>
                                <a href="desenvolvedores.html">Desenvolvedores</a>
                            </li>
                        </ul>
                    </li>
                    <li>

                        <a href="#" class="nav-link active">
                            <img src="../img/pt.webp" width="50%"></a>
                    </li>
                    <li class="lang">
                        <a href="../en/contato.html" class="nav-link">
                            <img src="../img/en.png" width="50%"></a>
                    </li>
                </ul>
            </nav>
            <button class="menu-toggle" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main style="max-width: 600px;">
        <h1>CONTATO</h1>

        <form id="contactForm" onsubmit="return valContato(event)" class="card">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" class="form-control" required placeholder="Insira seu nome completo"
                    pattern="^[a-zA-ZáàâãéèêíïóôõöúçñÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ\s]+$">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="form-control" required placeholder="seuemail@provedor.com">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" class="form-control" required pattern="[0-9\s\-\(\)\+]{10,15}"
                    placeholder="(19) 99999-9999">
            </div>

            <div class="form-group">
                <label for="avaliacao">Avalie nosso site</label>
                <select id="avaliacao" class="form-control" required style="background-color: var(--azul-profundo);">
                    <option value="" disabled selected>Escolha uma nota de 0 a 5</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comentario">Deixe seu comentário</label>
                <textarea id="comentario" class="form-control" rows="4"
                    placeholder="Deixa aqui um comentário!"></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar</button>
        </form>
    </main>

    <footer>
        <a class="ancora" href="#"><img src="../img/seta.png" width="50" height="50"></a>
        <p><strong>ETEC DE HORTOLÂNDIA 2026</strong> — © Todos os direitos reservados</p>
        <p>Trabalho acadêmico sem fins lucrativos</p>
    </footer>

    <script>
        function valContato(e) {
            e.preventDefault();
            const n = document.getElementById('nome').value;
            const a = document.getElementById('avaliacao').value;
            if (n.trim().length < 3) {
                alert('Por favor, informe seu nome completo.');
                return false;
            }
            alert('Obrigado, ' + n + '! Sua avaliação ' + a + '/5 foi enviada com sucesso.');
            document.getElementById('contactForm').reset();
            return true;
        }
     
        document.querySelector('.menu-toggle').addEventListener('click', () => {
            document.querySelector('.menu-toggle').classList.toggle('active');
            document.querySelector('.nav-menu').classList.toggle('active');
        });
    </script>
</body>

</html>
